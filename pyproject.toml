[project]
name = "ecfr-analyzer"
version = "0.2.0"
description = "Analyze the eCFR per agency; daily incremental refresh to a static site and JSON API"
requires-python = ">=3.12"
dependencies = ["duckdb==1.5.1", "jinja2==3.1.4", "fastapi==0.115.12", "uvicorn==0.34.2"]

[project.scripts]
ecfr = "ecfr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/ecfr"]

[dependency-groups]
dev = ["ruff==0.17.3"]

[tool.ruff]
line-length = 100 # every line count in RESULTS.md assumes this width

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"] # ruff 0.17 enables ~400 rules by default; keep the classic errors-only set
