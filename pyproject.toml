[project]
name = "ecfr-analyzer"
version = "0.1.0"
description = "Analyze the eCFR per agency; daily incremental refresh to a static site and JSON API"
requires-python = ">=3.12"
dependencies = ["duckdb==1.5.1", "jinja2==3.1.4", "fastapi==0.115.12", "uvicorn==0.34.2"]

[project.scripts]
ecfr = "ecfr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/ecfr"]

[dependency-groups]
dev = ["ruff==0.17.3"]
