{% for a in rows %}
<tr hx-get="ui/agency/{{ a.slug }}.html" hx-target="#detail" class="{{ 'child' if a.parent_slug }}"
    data-search="{{ (a.name ~ ' ' ~ (a.short_name or '')) | lower }}"{{ ' hidden' if a.parent_slug }}>
  <td>{{ a.name }}{% if a.short_name %} <span class="sub">({{ a.short_name }})</span>{% endif %}
    {% if a.changed %}<span class="badge">changed</span>{% endif %}</td>
  <td data-v="{{ a.words }}">{{ a.words | num }}</td>
  <td data-v="{{ a.density if a.density is not none }}">{{ a.density | f1 }}</td>
  <td data-v="{{ a.stale_share if a.stale_share is not none }}">{{ a.stale_share | pct }}</td>
  <td data-v="{{ a.flagged_parts }}">{{ a.flagged_parts | num }}</td>
</tr>
{% endfor %}
