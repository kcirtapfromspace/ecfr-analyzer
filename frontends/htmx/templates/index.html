<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eCFR Analyzer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>
  <script type="module" src="static/app.js"></script>
</head>
<body>
  <h1>eCFR Analyzer</h1>
  <main>
    <section>
      <div class="chart"><canvas data-testid="scatter" data-chart='{{ {"kind": "scatter", "data": scatter} | tojson }}'></canvas></div>
      <input type="search" data-testid="search" placeholder="Filter agencies (includes sub-agencies)" aria-label="Filter agencies">
      <table data-testid="agencies">
        <thead>
          <tr>
            <th data-sort="name">Agency</th>
            <th data-sort="words" aria-sort="descending">Words</th>
            <th data-sort="density">Restrictions / 1k</th>
            <th data-sort="stale_share">Unchanged since 2017</th>
            <th data-sort="flagged_parts">Flagged parts</th>
          </tr>
        </thead>
        <tbody>
          {% for a in rows %}
          <tr data-slug="{{ a.slug }}" hx-get="agency/{{ a.slug }}.html" hx-target="#detail"
              data-search="{{ (a.name ~ ' ' ~ (a.short_name or '')) | lower }}"{{ ' data-child hidden' if a.parent_slug }}>
            <td data-v="{{ a.name | lower }}">{{ a.name }}{% if a.short_name %} ({{ a.short_name }}){% endif %}</td>
            <td data-v="{{ a.words }}">{{ a.words | num }}</td>
            <td data-v="{{ a.density if a.density is not none }}">{{ a.density | f1 }}</td>
            <td data-v="{{ a.stale_share if a.stale_share is not none }}">{{ a.stale_share | pct }}</td>
            <td data-v="{{ a.flagged_parts }}">{{ a.flagged_parts | num }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </section>
    <aside id="detail"></aside>
  </main>
</body>
</html>
