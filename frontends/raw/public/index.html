<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eCFR Analyzer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <h1>eCFR Analyzer</h1>
  <main>
    <section>
      <div class="chart"><canvas data-testid="scatter" aria-label="Words vs. restriction density"></canvas></div>
      <input type="search" data-testid="search" placeholder="Filter agencies (includes sub-agencies)" aria-label="Filter agencies">
      <table data-testid="agencies">
        <thead>
          <tr>
            <th data-sort="name">Agency</th>
            <th data-sort="words">Words</th>
            <th data-sort="density">Restrictions / 1k</th>
            <th data-sort="stale_share">Unchanged since 2017</th>
            <th data-sort="flagged_parts">Flagged parts</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
    <aside id="detail" hidden>
      <h2 data-testid="detail-name"></h2>
      <dl>
        <dt>Words</dt><dd data-testid="detail-words"></dd>
        <dt>Restrictions / 1k</dt><dd data-testid="detail-density"></dd>
      </dl>
      <div class="chart"><canvas data-testid="history" aria-label="Section changes per year"></canvas></div>
    </aside>
  </main>
</body>
</html>
